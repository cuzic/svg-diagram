  <text x="348" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">納期遅れが続いている</text>
  <text x="278" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">残業が増えている</text>
  <text x="744" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">新人が辞めてしまう</text>
  <text x="462" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仕掛りが多い</text>
  <text x="265" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">急ぎの割り込みで作業の切</text>
  <text x="265" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">り替えが増える</text>
  <text x="378" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">経験者に仕事が集中する</text>
  <text x="709" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">新人が何をすればいいか分</text>
  <text x="709" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">からない</text>
  <text x="637" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">経験者に新人を教える時間</text>
  <text x="637" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">がない</text>
  <text x="581" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">受注するとすぐ着手する</text>
  <text x="175" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">営業が納期を約束してし</text>
  <text x="175" y="462" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">まう</text>
  <text x="331" y="592" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">見積もりが甘い</text>
  <text x="812" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手順書が古い</text>
  <text x="791" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手順書の更新が稼働に数え</text>
  <text x="791" y="462" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">られない</text>
  <text x="149" y="582" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">営業が現場の状況を把握で</text>
  <text x="149" y="602" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">きない</text>
  <text x="660" y="582" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">現場が稼働率で評価されて</text>
  <text x="660" y="602" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">いる</text>

  <text x="20" y="646" font-size="14" font-weight="400" fill="#6f6659">出典: 説明用の例</text>
