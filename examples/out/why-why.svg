  <text x="474" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">リリースが遅れた</text>
  <text x="474" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">修正に時間がかかった</text>
  <text x="369" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">影響範囲が広かった</text>
  <text x="369" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">検証が最後に集中していた</text>
  <text x="369" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">結合テストを毎週回す</text>
  <text x="579" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">不具合の発見が遅かった</text>
  <text x="579" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">監視の項目が足りない</text>
  <text x="579" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">アラートを足す</text>

  <text x="470" y="494" text-anchor="middle" font-size="14" font-weight="400" fill="#6f6659">矢印は原因 → 結果。「なぜ?」は矢印をさかのぼって（下へ）読む</text>

  <text x="470" y="530" text-anchor="middle" font-size="14" font-weight="400" fill="#6f6659">対策（破線の棒）は真因に打つ手で、なぜの答えではない</text>

