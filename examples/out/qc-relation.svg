  <text x="535" y="1120" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">納期に遅れる</text>
  <text x="535" y="1140" text-anchor="middle" font-size="14" fill="#6f6659">出 0・入 4</text>
  <text x="489" y="670" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">急ぎの割り込み</text>
  <text x="489" y="690" text-anchor="middle" font-size="14" fill="#6f6659">出 1・入 1</text>
  <text x="440" y="820" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">並行作業が多い</text>
  <text x="440" y="840" text-anchor="middle" font-size="14" fill="#6f6659">出 1・入 2</text>
  <text x="489" y="970" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">切り替えのロス</text>
  <text x="489" y="990" text-anchor="middle" font-size="14" fill="#6f6659">出 1・入 2</text>
  <text x="489" y="520" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">計画が守られない</text>
  <text x="489" y="540" text-anchor="middle" font-size="14" fill="#6f6659">出 2・入 2</text>
  <text x="394" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">見積もりが甘い</text>
  <text x="394" y="66" text-anchor="middle" font-size="14" fill="#22201b">出 3・入 0</text>
  <text x="648" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">経験者に集中</text>
  <text x="648" y="66" text-anchor="middle" font-size="14" fill="#6f6659">出 2・入 0</text>
  <text x="299" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">残業が増える</text>
  <text x="299" y="220" text-anchor="middle" font-size="14" fill="#6f6659">出 1・入 1</text>
  <text x="299" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">疲れてミスが増</text>
  <text x="299" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">える</text>
  <text x="299" y="390" text-anchor="middle" font-size="14" fill="#6f6659">出 2・入 1</text>

