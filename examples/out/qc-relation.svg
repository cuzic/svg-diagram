  <text x="535" y="1112" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">納期に遅れる</text>
  <text x="535" y="1132" text-anchor="middle" font-size="14" fill="#6f6659">出 0・入 4</text>
  <text x="489" y="662" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">急ぎの割り込み</text>
  <text x="489" y="682" text-anchor="middle" font-size="14" fill="#6f6659">出 1・入 1</text>
  <text x="440" y="812" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">並行作業が多い</text>
  <text x="440" y="832" text-anchor="middle" font-size="14" fill="#6f6659">出 1・入 2</text>
  <text x="489" y="962" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">切り替えのロス</text>
  <text x="489" y="982" text-anchor="middle" font-size="14" fill="#6f6659">出 1・入 2</text>
  <text x="489" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">計画が守られない</text>
  <text x="489" y="532" text-anchor="middle" font-size="14" fill="#6f6659">出 2・入 2</text>
  <text x="394" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">見積もりが甘い</text>
  <text x="394" y="62" text-anchor="middle" font-size="14" fill="#22201b">出 3・入 0</text>
  <text x="648" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">経験者に集中</text>
  <text x="648" y="62" text-anchor="middle" font-size="14" fill="#6f6659">出 2・入 0</text>
  <text x="299" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">残業が増える</text>
  <text x="299" y="212" text-anchor="middle" font-size="14" fill="#6f6659">出 1・入 1</text>
  <text x="299" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">疲れてミスが増</text>
  <text x="299" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">える</text>
  <text x="299" y="382" text-anchor="middle" font-size="14" fill="#6f6659">出 2・入 1</text>

