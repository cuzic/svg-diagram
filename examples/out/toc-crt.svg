  <text x="360" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">納期に遅れる</text>
  <text x="507" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">残業費が膨らむ</text>
  <text x="372" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">作業の切り替えが多い</text>
  <text x="568" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">急ぎの割り込みが入る</text>
  <text x="470" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仕掛りが多い</text>
  <text x="470" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">受注したらすぐ着手</text>
  <text x="470" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">する</text>
  <text x="470" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">稼働率で評価される</text>

