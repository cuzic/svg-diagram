  <text x="427" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">標準手順が全拠点で使わ</text>
  <text x="427" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">れる</text>
  <text x="318" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手順書が現場で読める形に</text>
  <text x="318" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">なる</text>
  <text x="535" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">拠点長が運用を支持する</text>
  <text x="463" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手順の改善提案が集まる</text>
  <text x="246" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手順書が長すぎる</text>
  <text x="680" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">拠点長に手間の負担が見</text>
  <text x="680" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">える</text>
  <text x="246" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">1 枚に絞った版を作る</text>
  <text x="680" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">負担の少ない運用例を示す</text>
  <text x="463" y="566" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">提案の窓口と締め切りを決</text>
  <text x="463" y="586" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">める</text>
  <text x="463" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">提案の様式が決まる</text>

  <text x="20" y="630" font-size="14" font-weight="400" fill="#6f6659">出典: 説明用の例</text>
