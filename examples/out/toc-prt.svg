  <text x="427" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">標準手順が全拠点で使わ</text>
  <text x="427" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">れる</text>
  <text x="427" y="82" text-anchor="middle" font-size="14" fill="#22201b">【ゴール】</text>
  <text x="318" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手順書が現場で読める形に</text>
  <text x="318" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">なる</text>
  <text x="535" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">拠点長が運用を支持する</text>
  <text x="463" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手順の改善提案が集まる</text>
  <text x="246" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手順書が長すぎる</text>
  <text x="680" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">拠点長に手間の負担が見</text>
  <text x="680" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">える</text>
  <text x="246" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">1 枚に絞った版を作る</text>
  <text x="680" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">負担の少ない運用例を示す</text>
  <text x="463" y="586" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">提案の窓口と締め切りを決</text>
  <text x="463" y="606" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">める</text>
  <text x="463" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">提案の様式が決まる</text>

