  <text x="285" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">全拠点に週次報告を義務づ</text>
  <text x="285" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">ける</text>
  <text x="285" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">報告の作成に時間を取ら</text>
  <text x="285" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">れる</text>
  <text x="467" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#6f6659">繁忙期と重なる</text>
  <text x="469" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">現場の残業が常態になる</text>
  <text x="469" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">人が辞めて、現場が回らな</text>
  <text x="469" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">くなる</text>
  <text x="656" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">報告を月次にして様式を 1</text>
  <text x="656" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">枚にする</text>
  <text x="656" y="334" text-anchor="middle" font-size="14" fill="#6f6659">→ 施策 1 に組み込む</text>

