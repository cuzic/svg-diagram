  <text x="472" y="90.7" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">A の見方: B</text>
  <text x="472" y="109.6" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">は報告が遅</text>
  <text x="472" y="128.5" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">い人</text>
  <text x="648" y="257.3" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">A の行動:</text>
  <text x="648" y="276.2" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">進捗を細か</text>
  <text x="648" y="295.1" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">く問いた</text>
  <text x="648" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">だす</text>
  <text x="472" y="442.7" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">B の見方: A</text>
  <text x="472" y="461.6" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">は信用して</text>
  <text x="472" y="480.5" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">いない人</text>
  <text x="292" y="266.7" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">B の行動:</text>
  <text x="292" y="285.6" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">報告を後回</text>
  <text x="292" y="304.5" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">しにする</text>
  <text x="470" y="285.6" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">箱の中の二人</text>

