  <text x="470" y="575.6" text-anchor="middle" font-size="14" font-weight="400" fill="#22201b"><tspan class="emoji">🧑</tspan> person   <tspan class="emoji">👥</tspan> people   <tspan class="emoji">📄</tspan> document   <tspan class="emoji">📁</tspan> folder   <tspan class="emoji">🔑</tspan> key   <tspan class="emoji">🔒</tspan> lock   <tspan class="emoji">🌉</tspan> bridge   <tspan class="emoji">🚧</tspan> fence   <tspan class="emoji">🪜</tspan> ladder</text>

