274A14 14 0 0 1 260 386V342A14 14 0 0 1 274 328Z" fill="rgb(220,233,247)" stroke="rgb(34,32,27)" stroke-width="2" stroke-linejoin="round"/><text x="272" y="357" font-size="18" fill="rgb(34,32,27)">日時は</text><text x="434" y="357" font-size="18" fill="rgb(34,32,27)">でお</text><text x="272" y="383" font-size="18" fill="rgb(34,32,27)">願いします。</text><g data-slot="day"><line x1="326" y1="362" x2="434" y2="362" stroke="rgb(111,102,89)" stroke-width="2" stroke-dasharray="2 3"/><text x="380" y="357" text-anchor="middle" font-size="14" fill="rgb(111,102,89)">日時</text></g></g><g data-input="message"><rect x="36" y="416" width="448" height="48" rx="24" fill="rgb(255,255,255)" stroke="rgb(111,102,89)" stroke-width="2"/><text x="52" y="445.6" font-size="16" fill="rgb(111,102,89)">指示を入力</text><circle cx="464" cy="440" r="12" fill="rgb(34,32,27)"/><path d="M459 442L464 436L469 442" fill="none" stroke="rgb(255,255,255)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
