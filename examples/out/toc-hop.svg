  <text x="441" y="474" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">着手の枠を決める</text>
  <text x="731" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仕掛りが減る</text>
  <text x="665" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">1 つずつ仕上げる</text>
  <text x="819" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手直しが減る</text>
  <text x="556" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">営業が納期を相談できる</text>
  <text x="122" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">受注の量は変えない</text>
  <text x="353" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">週に一度、枠を見直す</text>
  <text x="389" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">納期を守れる</text>
  <text x="410" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">顧客の信頼が増える</text>

