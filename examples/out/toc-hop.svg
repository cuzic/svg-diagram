  <text x="494" y="474" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">着手の枠を決める</text>
  <text x="592" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仕掛りが減る</text>
  <text x="537" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">1 つずつ仕上げる</text>
  <text x="690" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手直しが減る</text>
  <text x="417" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">営業が納期を相談できる</text>
  <text x="753" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">受注の量は変えない</text>
  <text x="214" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">週に一度、枠を見直す</text>
  <text x="260" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">納期を守れる</text>
  <text x="281" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">顧客の信頼が増える</text>

