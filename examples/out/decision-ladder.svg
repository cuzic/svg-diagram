  <text x="199" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">貸出票は書いてある？</text>
  <text x="449" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">窓口で受け付ける</text>
  <text x="199" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">返却期限は守れる？</text>
  <text x="449" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">貸出の手続きに進む</text>
  <text x="199" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">予約の本はある？</text>
  <text x="449" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">予約棚から取り出す</text>
  <text x="199" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">館内で読むだけ？</text>
  <text x="449" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">閲覧席へ案内する</text>
  <text x="199" y="303" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">次回の入荷を待てる？</text>
  <text x="449" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">入荷の連絡を登録する</text>
  <text x="449" y="313" text-anchor="middle" font-size="14" fill="#6f6659">7 日間有効</text>
  <text x="199" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">後日の来館をお願いする</text>
