  <text x="268" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">新しい勤怠システムを導入</text>
  <text x="268" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">するか</text>
  <text x="470" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">費用が下がる</text>
  <text x="693" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">保守費が半分になる</text>
  <text x="693" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">紙の集計がなくなる</text>
  <text x="484" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">現場の手間が減る</text>
  <text x="491" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">移行に時間がかかる</text>
  <text x="686" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">教育の時間が要る</text>
  <text x="679" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">旧データの整理</text>
  <text x="484" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">契約の縛りが長い</text>
