  <title id="svg-title">免疫マップ(任せられない課長)</title>
  <desc id="svg-desc">要素: 部下に仕事を任せる、自分で直してしまう、細かく進捗を確認する、頼まずに抱え込む、不安: 任せて品質が落ち、責められる、失敗を見られないことに専心している、頼りない人だと思われないことに専心している、(未記入)</desc>
