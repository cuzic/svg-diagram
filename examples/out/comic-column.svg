="p1.d1"><title>今週から、毎週＿＿は定時で上がります。</title><path d="M72 52H212A24 24 0 0 1 236 76V128A24 24 0 0 1 212 152L148.5 152L140.5 270L132.5 152H72A24 24 0 0 1 48 128V76A24 24 0 0 1 72 52Z" fill="#ffffff" stroke="#22201b" stroke-width="2.5" stroke-linejoin="round"/><text x="79" y="82" font-size="18" fill="#22201b">今週から、毎週</text><text x="133" y="108" font-size="18" fill="#22201b">は定時で</text><text x="88" y="134" font-size="18" fill="#22201b">上がります。</text><g data-slot="day"><line x1="79" y1="113" x2="133" y2="113" stroke="#6f6659" stroke-width="2" stroke-dasharray="2 3"/><text x="106" y="108" text-anchor="middle" font-size="14" fill="#6f6659">曜日</text></g></g><g data-bubble="p2.d1"><title>えっ、＿＿は大丈夫なの？</title><path d="M284 420H424A24 24 0 0 1 448 444V496A24 24 0 0 1 424 520L360.5 520L352.5 638L344.5 520H284A24 24 0 0 1 260 496V444A24 24 0 0 1 284 420Z" fill="#ffffff" stroke="#22201b" stroke-width="2.5" stroke-linejoin="round"/><text x="327" y="450" font-size="18" fill="#22201b">えっ、</text><text x="399" y="476" font-size="18" fill="#22201b">は</text><text x="300" y="502" font-size="18" fill="#22201b">大丈夫なの？</text><g data-slot="what"><line x1="291" y1="481" x2="399" y2="481" stroke="#6f6659" stroke-width="2" stroke-dasharray="2 3"/><text x="345" y="476" text-anchor="middle" font-size="14" fill="#6f6659">心配</text></g></g><g data-bubble="p2.d2"><title>先に＿＿しておきます。</title><path d="M72 526H212A24 24 0 0 1 236 550V602A24 24 0 0 1 212 626L149 626L141 638L133 626H72A24 24 0 0 1 48 602V550A24 24 0 0 1 72 526Z" fill="#ffffff" stroke="#22201b" stroke-width="2.5" stroke-linejoin="round"/><text x="124" y="556" font-size="18" fill="#22201b">先に</text><text x="169" y="582" font-size="18" fill="#22201b">してお</text><text x="106" y="608" font-size="18" fill="#22201b">きます。</text><g data-slot="prep"><line x1="61" y1="587" x2="169" y2="587" stroke="#6f6659" stroke-width="2" stroke-dasharray="2 3"/><text x="115" y="582" text-anchor="middle" font-size="14" fill="#6f6659">準備</text></g></g><g data-bubble="p3.