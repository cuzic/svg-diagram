  <text x="124" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">A：チームが成果を出し続</text>
  <text x="124" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">ける</text>
  <text x="470" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">B：部下が育ち、自分は次の</text>
  <text x="470" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仕事に進める</text>
  <text x="470" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">C：失敗の責任を負わされ</text>
  <text x="470" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">ない</text>
  <text x="816" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">D：部下に任せる</text>
  <text x="816" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">D'：自分で直す</text>
  <text x="21" y="270" text-anchor="start" font-size="14" fill="#22201b">1.</text>
  <text x="43" y="270" text-anchor="start" font-size="14" fill="#22201b">自分で直さないと品質が落ち、責められる</text>
  <rect x="632" y="188" width="20" height="22" fill="#ffffff"/>
