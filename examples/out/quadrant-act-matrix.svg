  <text x="280" y="154" text-anchor="middle" font-size="14" fill="#22201b">発言を控える</text>
  <text x="404" y="154" text-anchor="middle" font-size="14" fill="#22201b">資料を作り込みすぎる</text>
  <text x="672" y="334" text-anchor="middle" font-size="14" fill="#22201b">チームの役に立つこと</text>
  <text x="804" y="334" text-anchor="middle" font-size="14" fill="#22201b">学び続けること</text>
  <text x="728" y="154" text-anchor="middle" font-size="14" fill="#22201b">会議で一つ質問する</text>
  <text x="158" y="46" text-anchor="end" font-size="14" fill="#6f6659">五感で感じる（外）</text>
  <text x="158" y="362" text-anchor="end" font-size="14" fill="#6f6659">心の中（内）</text>
