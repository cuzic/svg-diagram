  <text x="360" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">新人からの相談</text>
  <text x="360" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">自分で答</text>
  <text x="360" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">えられる？</text>
  <text x="284" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">回答する</text>
  <text x="436" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">調べれば</text>
  <text x="436" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">わかる？</text>
  <text x="345" y="566" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">調べて回答する</text>
  <text x="345" y="586" text-anchor="middle" font-size="14" fill="#6f6659">24 時間以内</text>
  <text x="528" y="566" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">業務・スキル</text>
  <text x="528" y="586" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">の問題？</text>
  <text x="433" y="734" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">上司に相談する</text>
  <text x="433" y="754" text-anchor="middle" font-size="14" fill="#6f6659">目安: 当日中</text>
  <text x="622" y="734" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">人事・相談窓口に報告する</text>
  <text x="622" y="754" text-anchor="middle" font-size="14" fill="#6f6659">目安: 即時</text>
