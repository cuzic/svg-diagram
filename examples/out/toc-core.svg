  <text x="414" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">稼働率で評価される</text>
  <text x="414" y="434" text-anchor="middle" font-size="14" fill="#22201b">2/3 件の現象に届く</text>
  <text x="632" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">仕様の確認が遅い</text>
  <text x="632" y="434" text-anchor="middle" font-size="14" fill="#22201b">1/3 件の現象に届く</text>

