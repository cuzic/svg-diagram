  <text x="98" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">受注の投入を</text>
  <text x="98" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">現場の余力に合</text>
  <text x="98" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">わせて制限する</text>
  <text x="98" y="54" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">営業と現場の</text>
  <text x="98" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">情報共有の場を</text>
  <text x="98" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">設ける</text>
  <text x="98" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手順書を最新に</text>
  <text x="98" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">更新する</text>
  <text x="98" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#6f6659">現場が稼働率よ</text>
  <text x="98" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#6f6659">り納期で評価さ</text>
  <text x="98" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#6f6659">れる</text>
  <text x="346" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">受注してもすぐ</text>
  <text x="346" y="194" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">着手しない</text>
  <text x="594" y="179" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仕掛りが減り</text>
  <text x="594" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">作業が滞留し</text>
  <text x="594" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">ない</text>
  <text x="346" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">営業が現場の</text>
  <text x="346" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">状況を知って</text>
  <text x="346" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">納期を約束する</text>
  <text x="594" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">急ぎの割り込み</text>
  <text x="594" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">が減る</text>
  <text x="346" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">見積もりの工数</text>
  <text x="346" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">が正確になる</text>
  <text x="346" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">新人が自力で</text>
  <text x="346" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">作業を進めら</text>
  <text x="346" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">れる</text>
  <text x="594" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">経験者への集中</text>
  <text x="594" y="303" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">が解消される</text>
  <text x="842" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">納期遅れがなく</text>
  <text x="842" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">なる</text>
  <text x="842" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">残業が減る</text>
  <text x="594" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">新人が定着する</text>

