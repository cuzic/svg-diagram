  <text x="370" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">納期に遅れる</text>
  <text x="517" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">残業費が膨らむ</text>
  <text x="382" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">作業の切り替えが多い</text>
  <text x="578" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">急ぎの割り込みが入る</text>
  <text x="480" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仕掛りが多い</text>
  <text x="480" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">受注したらすぐ着手</text>
  <text x="480" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">する</text>
  <text x="480" y="582" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">稼働率で評価される</text>

