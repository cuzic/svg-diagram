  <text x="771" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">寸法のばらつき</text>
  <text x="278" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">人</text>
  <text x="217" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">作業者の経験差</text>
  <text x="211" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">新人が多い</text>
  <text x="190" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">教育の記録がない</text>
  <text x="282" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">測定のくせ</text>
  <text x="334" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">機械</text>
  <text x="287" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">刃物の摩耗</text>
  <text x="246" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">交換の基準がない</text>
  <text x="321" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">主軸の振れ</text>
  <text x="539" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">方法</text>
  <text x="475" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">段取りが人によっ</text>
  <text x="475" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">て違う</text>
  <text x="469" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手順書が古い</text>
  <text x="534" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">検査の頻度</text>
  <text x="587" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">材料</text>
  <text x="530" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">ロットごとの硬</text>
  <text x="530" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">さ差</text>
  <text x="517" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仕入先が複数</text>
  <text x="575" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">保管中の変形</text>

  <text x="20" y="526" font-size="14" font-weight="400" fill="#6f6659">出典: 説明用の例</text>
