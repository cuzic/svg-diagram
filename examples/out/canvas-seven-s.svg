  <rect x="704" y="188" width="216" height="128" rx="8" fill="#dce9f7" stroke="#1d5fa8" stroke-width="2.5"/>
  <text x="724" y="219" font-size="15" font-weight="700" fill="#22201b">制度・仕組み（Systems）</text>
  <text x="724" y="247" font-size="14" font-weight="400" fill="#22201b">・発注は店ごとの手書き</text>
  <text x="724" y="266.6" font-size="14" font-weight="400" fill="#22201b">台帳</text>
  <text x="724" y="294.2" font-size="14" font-weight="400" fill="#22201b">・売れ筋の集計が週 1 回</text>
  <rect x="808" y="176" width="100" height="24" rx="12" fill="#1d5fa8"/>
  <text x="858" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">重点・ハード</text>

  <rect x="20" y="332" width="444" height="136" rx="8" fill="#f6f8fa" stroke="#6f6659" stroke-width="2.5"/>
  <text x="40" y="363" font-size="15" font-weight="700" fill="#22201b">人材（Staff）</text>
  <text x="40" y="391" font-size="14" font-weight="400" fill="#22201b">・パートが主力（平均勤続 9 年）</text>
  <text x="40" y="418.6" font-size="14" font-weight="400" fill="#22201b">・若手が定着しない</text>
  <rect x="396" y="320" width="60" height="24" rx="12" fill="#6f6659"/>
  <text x="423" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ソフト</text>

  <rect x="476" y="332" width="444" height="136" rx="8" fill="#f6f8fa" stroke="#6f6659" stroke-width="2.5"/>
