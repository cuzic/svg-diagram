  <title id="svg-title">地方スーパーの 7S 診断</title>
  <desc id="svg-desc">要素: 戦略（Strategy）、組織構造（Structure）、経営スタイル（Style）、共通の価値観（Shared Values）、制度・仕組み（Systems）、人材（Staff）、スキル（Skills）</desc>
  <metadata id="svg-diagram">{"generator":"svg-diagram","toolVersion":"0.5.0","source":"examples/canvas-seven-s.ts","sourceSha256":"45fc4543f0990da167027fc0430a012d0e9f1bc0178bf0bbc4269c6913de6704"}</metadata>
