  <text x="496" y="391" font-size="14" font-weight="400" fill="#22201b">・鮮魚のさばき</text>
  <text x="496" y="418.6" font-size="14" font-weight="400" fill="#22201b">・惣菜の開発</text>
  <text x="496" y="446.2" font-size="14" font-weight="400" fill="#22201b">・データ活用は弱い</text>
  <rect x="852" y="320" width="60" height="24" rx="12" fill="#6f6659"/>
