  <rect x="0" y="0" width="940" height="524" fill="#ffffff"/>

  <text x="20" y="35" font-size="15" font-weight="700" fill="#22201b">7S の現状</text>

  <rect x="20" y="60" width="444" height="112" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="40" y="91" font-size="15" font-weight="700" fill="#22201b">戦略（Strategy）</text>
  <text x="40" y="119" font-size="14" font-weight="400" fill="#22201b">・惣菜と地元産の鮮度で勝つ</text>
  <text x="40" y="146.6" font-size="14" font-weight="400" fill="#22201b">・郊外への出店は止める</text>
  <rect x="396" y="48" width="60" height="24" rx="12" fill="#6f6659"/>
  <text x="423" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ハード</text>

  <rect x="476" y="60" width="444" height="112" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="496" y="91" font-size="15" font-weight="700" fill="#22201b">組織構造（Structure）</text>
  <text x="496" y="119" font-size="14" font-weight="400" fill="#22201b">・店長に仕入れの裁量がある</text>
  <text x="496" y="146.6" font-size="14" font-weight="400" fill="#22201b">・本部は 12 人と小さい</text>
  <rect x="852" y="48" width="60" height="24" rx="12" fill="#6f6659"/>
  <text x="879" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ハード</text>

  <rect x="20" y="188" width="216" height="128" rx="8" fill="#f6f8fa" stroke="#6f6659" stroke-width="2.5"/>
  <text x="40" y="219" font-size="15" font-weight="700" fill="#22201b">経営スタイル（Style）</text>
  <text x="40" y="247" font-size="14" font-weight="400" fill="#22201b">・社長が毎朝売り場に立つ</text>
  <rect x="168" y="176" width="60" height="24" rx="12" fill="#6f6659"/>
  <text x="195" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ソフト</text>

  <rect x="248" y="188" width="444" height="128" rx="8" fill="#dce9f7" stroke="#1d5fa8" stroke-width="2.5"/>
  <text x="268" y="219" font-size="15" font-weight="700" fill="#22201b">共通の価値観（Shared Values）</text>
  <text x="268" y="247" font-size="14" font-weight="400" fill="#22201b">・地元の食卓を守る</text>
  <text x="268" y="274.6" font-size="14" font-weight="400" fill="#22201b">・顔の見える商売</text>
  <rect x="636" y="176" width="44" height="24" rx="12" fill="#6f6659"/>
