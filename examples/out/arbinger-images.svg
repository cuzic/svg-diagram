  <text x="32" y="115" font-size="14" font-weight="700" fill="#22201b">型</text>
  <text x="257" y="115" font-size="14" font-weight="700" fill="#22201b">自分のイメージ</text>
  <text x="482" y="115" font-size="14" font-weight="700" fill="#22201b">相手への見方</text>
  <text x="707" y="115" font-size="14" font-weight="700" fill="#22201b">典型の行動</text>
  <text x="32" y="151" font-size="14" font-weight="400" fill="#22201b">自分は優れている</text>
  <text x="257" y="151" font-size="14" font-weight="400" fill="#22201b">私のほうが分かっている</text>
  <text x="482" y="151" font-size="14" font-weight="400" fill="#22201b">相手は分かっていない</text>
  <text x="707" y="151" font-size="14" font-weight="400" fill="#22201b">指図する・口を挟む</text>
  <text x="32" y="186" font-size="14" font-weight="400" fill="#22201b">自分には当然の権利がある</text>
  <text x="257" y="186" font-size="14" font-weight="400" fill="#22201b">私は報われるべきだ</text>
  <text x="482" y="186" font-size="14" font-weight="400" fill="#22201b">相手は邪魔をしている</text>
  <text x="707" y="186" font-size="14" font-weight="400" fill="#22201b">要求する・不満を溜める</text>
  <text x="32" y="222" font-size="14" font-weight="400" fill="#22201b">きちんとした人に見られたい</text>
  <text x="257" y="222" font-size="14" font-weight="400" fill="#22201b">私は立派でいたい</text>
  <text x="482" y="222" font-size="14" font-weight="400" fill="#22201b">相手は評価する側</text>
  <text x="707" y="222" font-size="14" font-weight="400" fill="#22201b">取り繕う・弱みを隠す</text>
  <text x="32" y="257" font-size="14" font-weight="400" fill="#22201b">自分は不当に扱われている</text>
  <text x="257" y="257" font-size="14" font-weight="400" fill="#22201b">私は報われない</text>
  <text x="482" y="257" font-size="14" font-weight="400" fill="#22201b">相手が悪い</text>
  <text x="707" y="257" font-size="14" font-weight="400" fill="#22201b">ため息・黙って抱え込む</text>
  <path d="M28,56 H912 A8,8 0 0 1 920,64 V263 A8,8 0 0 1 912,271 H28 A8,8 0 0 1 20,263 V64 A8,8 0 0 1 28,56 Z" fill="none" stroke="#22201b" stroke-width="2.5"/>

  <text x="20" y="302" font-size="14" font-weight="400" fill="#6f6659">出典: 説明用の例(用語は書籍で要照合)</text>
