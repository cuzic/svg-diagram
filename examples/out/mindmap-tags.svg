  <text x="275" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">新しい勤怠システムを導入</text>
  <text x="275" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">するか</text>
  <text x="466" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">賛成の理由</text>
