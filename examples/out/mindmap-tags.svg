  <text x="668" y="90" text-anchor="middle" font-size="14" fill="#6f6659">月末の作業が半日→1時間</text>
  <text x="657" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">打刻の漏れがなくなる</text>
  <text x="466" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">反対の理由</text>
  <text x="650" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">移行に時間がかかる</text>
  <text x="668" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">費用が見合わない</text>
  <text x="668" y="374" text-anchor="middle" font-size="14" fill="#6f6659">年間の利用料が現行の2倍</text>
  <text x="473" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">次にやること</text>
  <text x="657" y="462" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">現場に聞き取りをする</text>
  <text x="657" y="550" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">他社の導入例を調べる</text>
