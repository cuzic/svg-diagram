<svg xmlns="http://www.w3.org/2000/svg" width="940" height="870" viewBox="0 0 940 870" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">新人看護師の共感マップ</title>
  <desc id="svg-desc">要素: 考えていること（Thinks）、言っていること（Says）、新人看護師（対象）、していること（Does）、感じていること（Feels）、ペイン（痛み・不安）、ゲイン（望み・期待）</desc>
  <metadata id="svg-diagram">{"generator":"svg-diagram","toolVersion":"0.5.0","source":"examples/canvas-empathy.ts","sourceSha256":"3db03fb430bded23080367372e38be077bf2f3d998882df37268021f21c83e71"}</metadata>
  <style>
    text { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','YuGothic',Meiryo,'Noto Sans JP',sans-serif; }
    .emoji { font-family: 'Noto Color Emoji','Segoe UI Emoji',sans-serif; }
  </style>
  <rect x="0" y="0" width="940" height="870" fill="#ffffff"/>

  <text x="20" y="35" font-size="15" font-weight="700" fill="#22201b">観察から見えたこと</text>

  <rect x="20" y="48" width="900" height="168" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="40" y="80" font-size="15" font-weight="700" fill="#22201b">考えていること（Thinks）</text>
  <text x="40" y="108" font-size="14" font-weight="400" fill="#22201b">・先輩に何度も聞いたら迷惑かな</text>
  <text x="40" y="135.6" font-size="14" font-weight="400" fill="#22201b">・自分だけ遅れているのでは</text>

  <rect x="20" y="228" width="292" height="216" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="40" y="257.0454545454545" font-size="15" font-weight="700" fill="#22201b">言っていること（Says）</text>
  <text x="40" y="285.0454545454545" font-size="14" font-weight="400" fill="#22201b">・「大丈夫です、やれます」</text>
  <text x="40" y="312.6454545454545" font-size="14" font-weight="400" fill="#22201b">・「あとで確認します」</text>

  <rect x="324" y="228" width="292" height="216" rx="8" fill="#dce9f7" stroke="#1d5fa8" stroke-width="2.5"/>
  <text x="343.3333333333333" y="257.0454545454545" font-size="15" font-weight="700" fill="#22201b">新人看護師（対象）</text>
  <text x="343.3333333333333" y="285.0454545454545" font-size="14" font-weight="400" fill="#22201b">入職 3 か月の看護師。夜勤が始まった</text>
  <rect x="560" y="216" width="44" height="24" rx="12" fill="#6f6659"/>
  <text x="583" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">中心</text>

  <rect x="628" y="228" width="292" height="216" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="646.6666666666666" y="257.0454545454545" font-size="15" font-weight="700" fill="#22201b">していること（Does）</text>
  <text x="646.6666666666666" y="285.0454545454545" font-size="14" font-weight="400" fill="#22201b">・メモを持ち歩き、休憩中に見返す</text>
  <text x="646.6666666666666" y="312.6454545454545" font-size="14" font-weight="400" fill="#22201b">・分からない手順を 1 人で調べる</text>

  <rect x="20" y="452" width="900" height="168" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="40" y="484.2045454545454" font-size="15" font-weight="700" fill="#22201b">感じていること（Feels）</text>
  <text x="40" y="512.2045454545454" font-size="14" font-weight="400" fill="#22201b">・夜勤の前は眠れないほど緊張する</text>
  <text x="40" y="539.8045454545454" font-size="14" font-weight="400" fill="#22201b">・ミスを指摘されると体が固まる</text>

  <rect x="20" y="632" width="444" height="184" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="40" y="661.2499999999999" font-size="15" font-weight="700" fill="#22201b">ペイン（痛み・不安）</text>
  <text x="40" y="689.2499999999999" font-size="14" font-weight="400" fill="#22201b">・質問のタイミングが分からない</text>
  <text x="40" y="716.8499999999999" font-size="14" font-weight="400" fill="#22201b">・申し送りが早口で聞き取れない</text>

  <rect x="476" y="632" width="444" height="184" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="495" y="661.2499999999999" font-size="15" font-weight="700" fill="#22201b">ゲイン（望み・期待）</text>
  <text x="495" y="689.2499999999999" font-size="14" font-weight="400" fill="#22201b">・手順を見返せる 1 枚の資料</text>
  <text x="495" y="716.8499999999999" font-size="14" font-weight="400" fill="#22201b">・「聞いていいよ」と言ってくれる先輩</text>

  <text x="20" y="843.9999999999999" font-size="14" font-weight="400" fill="#6f6659">出典: 説明用の例</text>
</svg>
