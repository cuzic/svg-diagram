<svg xmlns="http://www.w3.org/2000/svg" width="940" height="684" viewBox="0 0 940 684" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">宅配ミールキットのビジネスモデル</title>
  <desc id="svg-desc">要素: 主要パートナー、主要活動、主要リソース、提供価値、顧客との関係、チャネル、顧客セグメント、コスト構造、収益の流れ</desc>
  <metadata id="svg-diagram">{"generator":"svg-diagram","toolVersion":"0.5.0","source":"examples/canvas-bmc.ts","sourceSha256":"9f3a9ff4070ea476bc82ae527c54d58b103d11fd124e99ac568a793cfa0264f0"}</metadata>
  <style>
    text { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','YuGothic',Meiryo,'Noto Sans JP',sans-serif; }
    .emoji { font-family: 'Noto Color Emoji','Segoe UI Emoji',sans-serif; }
  </style>
  <rect x="0" y="0" width="940" height="684" fill="#ffffff"/>

  <text x="20" y="35" font-size="15" font-weight="700" fill="#22201b">ビジネスモデルキャンバス</text>

  <rect x="20" y="60" width="172" height="388" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="40" y="91" font-size="15" font-weight="700" fill="#22201b">主要パートナー</text>
  <text x="40" y="119" font-size="14" font-weight="400" fill="#22201b">・地元の契約農家</text>
  <text x="40" y="146.6" font-size="14" font-weight="400" fill="#22201b">・冷蔵物流の会社</text>
  <text x="40" y="174.2" font-size="14" font-weight="400" fill="#22201b">・決済代行</text>

  <rect x="204" y="60" width="168" height="188" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="224" y="91" font-size="15" font-weight="700" fill="#22201b">主要活動</text>
  <text x="224" y="119" font-size="14" font-weight="400" fill="#22201b">・献立の開発</text>
  <text x="224" y="146.6" font-size="14" font-weight="400" fill="#22201b">・仕入れと小分け</text>
  <text x="224" y="174.2" font-size="14" font-weight="400" fill="#22201b">・定期便の配送</text>

  <rect x="204" y="260" width="168" height="188" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="224" y="291" font-size="15" font-weight="700" fill="#22201b">主要リソース</text>
  <text x="224" y="319" font-size="14" font-weight="400" fill="#22201b">・管理栄養士のレ</text>
  <text x="224" y="338.6" font-size="14" font-weight="400" fill="#22201b">シピ</text>
  <text x="224" y="366.2" font-size="14" font-weight="400" fill="#22201b">・小分け用の調理場</text>
  <text x="224" y="393.8" font-size="14" font-weight="400" fill="#22201b">・配送網</text>

  <rect x="384" y="60" width="172" height="388" rx="8" fill="#dce9f7" stroke="#1d5fa8" stroke-width="2.5"/>
  <text x="404" y="91" font-size="15" font-weight="700" fill="#22201b">提供価値</text>
  <text x="404" y="119" font-size="14" font-weight="400" fill="#22201b">・20 分で作れる夕食</text>
  <text x="404" y="146.6" font-size="14" font-weight="400" fill="#22201b">・食材の買い物と献</text>
  <text x="404" y="166.2" font-size="14" font-weight="400" fill="#22201b">立決めが要らない</text>
  <text x="404" y="193.79999999999998" font-size="14" font-weight="400" fill="#22201b">・余らせず、捨てず</text>
  <text x="404" y="213.39999999999998" font-size="14" font-weight="400" fill="#22201b">に済む</text>
  <rect x="500" y="48" width="44" height="24" rx="12" fill="#1d5fa8"/>
  <text x="522" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">重点</text>

  <rect x="568" y="60" width="168" height="188" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="588" y="91" font-size="15" font-weight="700" fill="#22201b">顧客との関係</text>
  <text x="588" y="119" font-size="14" font-weight="400" fill="#22201b">・アプリで献立を選</text>
  <text x="588" y="138.6" font-size="14" font-weight="400" fill="#22201b">べる</text>
  <text x="588" y="166.2" font-size="14" font-weight="400" fill="#22201b">・休止・変更がいつ</text>
  <text x="588" y="185.8" font-size="14" font-weight="400" fill="#22201b">でもできる</text>

  <rect x="568" y="260" width="168" height="188" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="588" y="291" font-size="15" font-weight="700" fill="#22201b">チャネル</text>
  <text x="588" y="319" font-size="14" font-weight="400" fill="#22201b">・自社アプリ</text>
  <text x="588" y="346.6" font-size="14" font-weight="400" fill="#22201b">・SNS の広告</text>
  <text x="588" y="374.2" font-size="14" font-weight="400" fill="#22201b">・勤務先の福利厚生</text>

  <rect x="748" y="60" width="172" height="388" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="768" y="91" font-size="15" font-weight="700" fill="#22201b">顧客セグメント</text>
  <text x="768" y="119" font-size="14" font-weight="400" fill="#22201b">・共働きの子育て</text>
  <text x="768" y="138.6" font-size="14" font-weight="400" fill="#22201b">世帯</text>
  <text x="768" y="166.2" font-size="14" font-weight="400" fill="#22201b">・平日に料理の時間</text>
  <text x="768" y="185.8" font-size="14" font-weight="400" fill="#22201b">が取れない単身者</text>

  <rect x="20" y="460" width="444" height="168" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="40" y="491" font-size="15" font-weight="700" fill="#22201b">コスト構造</text>
  <text x="40" y="519" font-size="14" font-weight="400" fill="#22201b">・食材の仕入れ</text>
  <text x="40" y="546.6" font-size="14" font-weight="400" fill="#22201b">・配送費</text>
  <text x="40" y="574.2" font-size="14" font-weight="400" fill="#22201b">・調理場の人件費</text>
  <text x="40" y="601.8" font-size="14" font-weight="400" fill="#22201b">・アプリの開発・運用</text>

  <rect x="476" y="460" width="444" height="168" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="496" y="491" font-size="15" font-weight="700" fill="#22201b">収益の流れ</text>
  <text x="496" y="519" font-size="14" font-weight="400" fill="#22201b">・定期便の月額（週 3 回で 9,800 円）</text>
  <text x="496" y="546.6" font-size="14" font-weight="400" fill="#22201b">・単品の追加注文</text>
  <text x="496" y="574.2" font-size="14" font-weight="400" fill="#22201b">・企業向けの福利厚生プラン</text>
  <rect x="844" y="600" width="68" height="24" rx="4" fill="#ffffff" stroke="#e0d6c5" stroke-width="1"/>
  <text x="880" y="617" font-size="14" text-anchor="middle" fill="#6f6659">架空の例</text>

  <text x="20" y="658" font-size="14" font-weight="400" fill="#6f6659">出典: 説明用の例</text>
