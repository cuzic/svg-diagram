  <text x="97" y="51" font-size="15" font-weight="700" fill="#1d5fa8">今すぐやる</text>
  <text x="97" y="70" font-size="14" fill="#6f6659">重要で緊急。自分で片付ける</text>
  <text x="513" y="51" font-size="15" font-weight="700" fill="#1d5fa8">計画してやる</text>
  <text x="513" y="70" font-size="14" fill="#6f6659">重要だが急がない。日程に入れる</text>
  <text x="97" y="227" font-size="15" font-weight="700" fill="#22201b">任せる</text>
  <text x="97" y="246" font-size="14" fill="#6f6659">緊急だが重要でない。人に頼む</text>
  <text x="513" y="227" font-size="15" font-weight="700" fill="#22201b">やめる</text>
  <text x="513" y="246" font-size="14" fill="#6f6659">重要でも緊急でもない。減らす</text>
  <text x="244" y="154" text-anchor="middle" font-size="14" fill="#22201b">障害の一次対応</text>
  <text x="348" y="154" text-anchor="middle" font-size="14" fill="#22201b">明日の提案書</text>
  <text x="648" y="154" text-anchor="middle" font-size="14" fill="#22201b">新人の育成計画</text>
  <text x="744" y="154" text-anchor="middle" font-size="14" fill="#22201b">資格の勉強</text>
  <text x="804" y="154" text-anchor="middle" font-size="14" fill="#22201b">運動</text>
  <text x="252" y="330" text-anchor="middle" font-size="14" fill="#22201b">定例会議の出席</text>
  <text x="348" y="330" text-anchor="middle" font-size="14" fill="#22201b">備品の注文</text>
  <text x="708" y="330" text-anchor="middle" font-size="14" fill="#22201b">ニュースの巡回</text>
  <text x="77" y="46" text-anchor="end" font-size="14" fill="#6f6659">高い</text>
  <text x="77" y="368" text-anchor="end" font-size="14" fill="#6f6659">低い</text>
  <text x="77" y="206" text-anchor="end" font-size="15" font-weight="700" fill="#22201b">重要度</text>
  <text x="87" y="398" font-size="14" fill="#6f6659">高い</text>
  <text x="912" y="398" text-anchor="end" font-size="14" fill="#6f6659">低い</text>
  <text x="500" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#22201b">緊急度</text>
