  <text x="244" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">不良率を半減させる</text>
  <text x="456" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">作業のばらつきをなくす</text>
  <text x="661" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">手順書を作り直す</text>
  <text x="668" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">治具で位置を決める</text>
  <text x="675" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">新人教育を標準化する</text>
  <text x="435" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">設備の状態を保つ</text>
  <text x="682" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">刃物の交換基準を決める</text>
  <text x="675" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">日常点検を</text>
  <text x="675" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">チェックシート化する</text>
  <text x="442" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">不良を早く見つける</text>
  <text x="668" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">工程内で寸法を測る</text>
  <text x="682" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">管理図で異常を知らせる</text>

