<svg xmlns="http://www.w3.org/2000/svg" width="940" height="582" viewBox="0 0 940 582" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">ブラウザ操作を任せるときの分担</title>
  <desc id="svg-desc">要素: 許可、実行、確認</desc>
  <metadata id="svg-diagram">{"generator":"svg-diagram","toolVersion":"0.5.0","source":"examples/emphasis.ts","sourceSha256":"51cdd9d3dfa79c9d2f31ef8ec5f00a26c87e286187921eebca4dec975a5e39f2"}</metadata>
  <style>
    text { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','YuGothic',Meiryo,'Noto Sans JP',sans-serif; }
    .emoji { font-family: 'Noto Color Emoji','Segoe UI Emoji',sans-serif; }
  </style>
  <rect x="0" y="0" width="940" height="582" fill="#ffffff"/>

  <text x="470" y="34" text-anchor="middle" font-size="14" font-weight="400" fill="#22201b">ブラウザ操作を <tspan font-weight="700">Claude in Chrome</tspan> に任せる</text>

  <rect x="20" y="56" width="440" height="128" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="40" y="86.6" font-size="15" font-weight="700" fill="#22201b">許可</text>
  <text x="40" y="114.6" font-size="14" font-weight="400" fill="#22201b">操作してよいサイトは <tspan font-weight="700" fill="#b91c1c">ユーザー</tspan> が決める。<tspan font-weight="700">API</tspan>s を呼ぶ前に</text>
  <text x="40" y="134.2" font-size="14" font-weight="400" fill="#22201b">確認する。</text>
  <text x="40" y="161.8" font-size="14" font-weight="400" fill="#6f6659">例: <tspan font-weight="700">lib/**/*.ts</tspan> のような記号も、文字列ならそのまま</text>

  <rect x="480" y="56" width="440" height="128" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="500" y="86.6" font-size="15" font-weight="700" fill="#22201b">実行</text>
  <text x="500" y="114.6" font-size="14" font-weight="400" fill="#22201b">手順は <tspan font-weight="700">1 つずつ</tspan> 進め、<tspan fill="#6f6659">画面が変わったら</tspan> 読み直す。</text>
  <text x="500" y="142.2" font-size="14" font-weight="400" fill="#22201b">戻せない操作（<tspan font-weight="700" fill="#b91c1c">送信・削除</tspan>）は止まる。</text>

  <rect x="20" y="200" width="900" height="140" rx="8" fill="#f6f8fa" stroke="#6f6659" stroke-width="2.5"/>

  <text x="36" y="230.4" font-size="15" font-weight="700" fill="#22201b">記録と責任</text>

  <rect x="36" y="244" width="868" height="80" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="56" y="275.4" font-size="15" font-weight="700" fill="#22201b">確認</text>
  <text x="56" y="303.4" font-size="14" font-weight="400" fill="#22201b">結果は <tspan font-weight="700">画面のスクリーンショット</tspan> で残す。</text>

  <rect x="20" y="356" width="440" height="108" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="240" y="407" text-anchor="middle" font-size="34" font-weight="700" fill="#22201b">3</text>
  <text x="240" y="442.6" text-anchor="middle" font-size="14" font-weight="400" fill="#6f6659">確認が要る操作の <tspan font-weight="700">数</tspan></text>

  <rect x="480" y="356" width="440" height="108" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="700" y="407" text-anchor="middle" font-size="34" font-weight="700" fill="#1d5fa8">0</text>
  <text x="700" y="442.6" text-anchor="middle" font-size="14" font-weight="400" fill="#6f6659">勝手に実行される操作</text>

  <rect x="20" y="480" width="900" height="84" rx="8" fill="#dce9f7" stroke="#1d5fa8" stroke-width="2.5"/>
  <text x="470" y="512.2" text-anchor="middle" font-size="16" font-weight="700" fill="#22201b">任せるのは操作、決めるのは人</text>
  <text x="470" y="540.6" text-anchor="middle" font-size="14" font-weight="400" fill="#6f6659">迷ったら <tspan font-weight="700" fill="#1d5fa8">止まって聞く</tspan></text>
</svg>
