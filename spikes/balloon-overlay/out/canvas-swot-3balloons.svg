<svg xmlns="http://www.w3.org/2000/svg" width="940" height="436" viewBox="0 0 940 436" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">地方の老舗書店の SWOT 分析</title>
  <desc id="svg-desc">要素: 強み（Strengths）、弱み（Weaknesses）、機会（Opportunities）、脅威（Threats）</desc>
  <style>
    text { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','YuGothic',Meiryo,'Noto Sans JP',sans-serif; }
    .emoji { font-family: 'Noto Color Emoji','Segoe UI Emoji',sans-serif; }
  </style>
  <rect x="0" y="0" width="940" height="436" fill="#ffffff"/>

  <text x="20" y="35" font-size="15" font-weight="700" fill="#22201b">現状分析</text>

  <rect x="20" y="60" width="444" height="136" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="40" y="91" font-size="15" font-weight="700" fill="#22201b">強み（Strengths）</text>
  <text x="40" y="119" font-size="14" font-weight="400" fill="#22201b">・地域の学校・図書館との取引</text>
  <text x="40" y="146.6" font-size="14" font-weight="400" fill="#22201b">・目利きのいる選書</text>
  <text x="40" y="174.2" font-size="14" font-weight="400" fill="#22201b">・駅前の立地</text>
  <rect x="324" y="48" width="128" height="24" rx="12" fill="#6f6659"/>
  <text x="388" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">内部環境・プラス</text>

  <rect x="476" y="60" width="444" height="136" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="496" y="91" font-size="15" font-weight="700" fill="#22201b">弱み（Weaknesses）</text>
  <text x="496" y="119" font-size="14" font-weight="400" fill="#22201b">・在庫の管理が人頼み</text>
  <text x="496" y="146.6" font-size="14" font-weight="400" fill="#22201b">・ネット販売の経験が浅い</text>
  <text x="496" y="174.2" font-size="14" font-weight="400" fill="#22201b">・店員の高齢化</text>
  <rect x="768" y="48" width="144" height="24" rx="12" fill="#6f6659"/>
  <text x="837" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">内部環境・マイナス</text>

  <rect x="20" y="212" width="444" height="168" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="40" y="243" font-size="15" font-weight="700" fill="#22201b">機会（Opportunities）</text>
  <text x="40" y="271" font-size="14" font-weight="400" fill="#22201b">・地域の読書イベントの需要</text>
  <text x="40" y="298.6" font-size="14" font-weight="400" fill="#22201b">・学校の探究学習で資料が要る</text>
  <text x="40" y="326.2" font-size="14" font-weight="400" fill="#22201b">・古本の買い取り市場</text>
  <rect x="324" y="200" width="128" height="24" rx="12" fill="#6f6659"/>
  <text x="388" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">外部環境・プラス</text>

  <rect x="476" y="212" width="444" height="168" rx="8" fill="#ffffff" stroke="#22201b" stroke-width="2.5"/>
  <text x="496" y="243" font-size="15" font-weight="700" fill="#22201b">脅威（Threats）</text>
  <text x="496" y="271" font-size="14" font-weight="400" fill="#22201b">・大手ネット書店の値引き</text>
  <text x="496" y="298.6" font-size="14" font-weight="400" fill="#22201b">・電子書籍の普及</text>
  <text x="496" y="326.2" font-size="14" font-weight="400" fill="#22201b">・再開発による賃料の上昇</text>
  <rect x="768" y="200" width="144" height="24" rx="12" fill="#6f6659"/>
  <text x="837" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">外部環境・マイナス</text>
  <rect x="844" y="352" width="68" height="24" rx="4" fill="#ffffff" stroke="#e0d6c5" stroke-width="1"/>
  <text x="880" y="369" font-size="14" text-anchor="middle" fill="#6f6659">架空の例</text>

  <text x="20" y="410" font-size="14" font-weight="400" fill="#6f6659">出典: 説明用の例</text>
<g id="overlay-layer"><g class="overlay"><path d="M226 12H262A18 18 0 0 1 280 30V30A18 18 0 0 1 262 48L252 48L244 56L236 48H226A18 18 0 0 1 208 30V30A18 18 0 0 1 226 12Z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><path d="M226 12H262A18 18 0 0 1 280 30V30A18 18 0 0 1 262 48L252 48L244 56L236 48H226A18 18 0 0 1 208 30V30A18 18 0 0 1 226 12Z" fill="#fff4c2" stroke="#22201b" stroke-width="2" stroke-linejoin="round"/><text x="244" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#22201b">要確認</text></g><g class="overlay"><path d="M658 12H738A18 18 0 0 1 756 30V30A18 18 0 0 1 738 48L706 48L698 56L690 48H658A18 18 0 0 1 640 30V30A18 18 0 0 1 658 12Z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><path d="M658 12H738A18 18 0 0 1 756 30V30A18 18 0 0 1 738 48L706 48L698 56L690 48H658A18 18 0 0 1 640 30V30A18 18 0 0 1 658 12Z" fill="#fff4c2" stroke="#22201b" stroke-width="2" stroke-linejoin="round"/><text x="698" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#22201b">ここが変更点</text></g><g class="overlay"><path d="M226 392L236 392L244 384L252 392H262A18 18 0 0 1 280 410V410A18 18 0 0 1 262 428H226A18 18 0 0 1 208 410V410A18 18 0 0 1 226 392Z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><path d="M226 392L236 392L244 384L252 392H262A18 18 0 0 1 280 410V410A18 18 0 0 1 262 428H226A18 18 0 0 1 208 410V410A18 18 0 0 1 226 392Z" fill="#fff4c2" stroke="#22201b" stroke-width="2" stroke-linejoin="round"/><text x="244" y="415" text-anchor="middle" font-size="15" font-weight="700" fill="#22201b">要確認</text></g></g></svg>
