  <text x="124" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">利用者カード</text>
  <text x="124" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">を持っている？</text>
  <text x="410" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">カードで受け付ける</text>
  <text x="410" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">本人確認の</text>
  <text x="410" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">書類がある？</text>
  <text x="696" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">その場でカードを作る</text>
  <text x="696" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">家族がカード</text>
  <text x="696" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">を持っている？</text>
  <text x="988" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">家族の同意書で受け付ける</text>
  <text x="988" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">館内で読</text>
  <text x="988" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">むだけ？</text>
  <text x="1260" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">閲覧席へ案内する</text>
  <text x="1260" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">予約だけ</text>
  <text x="1260" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">したい？</text>
  <text x="1525" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仮予約の票を渡す</text>
  <text x="1525" y="274" text-anchor="middle" font-size="14" fill="#6f6659">7 日間有効</text>
  <text x="1525" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">後日の来館をお願いする</text>
