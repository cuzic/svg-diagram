  <text x="185" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">利用者カードを持っている？</text>
  <text x="463" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">カードで受け付ける</text>
  <text x="185" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">本人確認の書類がある？</text>
  <text x="463" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">その場でカードを作る</text>
  <text x="185" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">家族がカードを持っている？</text>
  <text x="463" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">家族の同意書で受け付ける</text>
  <text x="185" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">館内で読むだけ？</text>
  <text x="463" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">閲覧席へ案内する</text>
  <text x="185" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">予約だけしたい？</text>
  <text x="463" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仮予約の票を渡す</text>
  <text x="463" y="334" text-anchor="middle" font-size="14" fill="#6f6659">7 日間有効</text>
  <text x="185" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">後日の来館をお願いする</text>
