  <text x="267" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">利用者カード</text>
  <text x="267" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">を持っている？</text>
  <text x="168" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">カードで受け付ける</text>
  <text x="365" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">本人確認の</text>
  <text x="365" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">書類がある？</text>
  <text x="259" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">その場でカードを作る</text>
  <text x="471" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">家族がカード</text>
  <text x="471" y="490" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">を持っている？</text>
  <text x="368" y="668" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">家族の同意書で受け付ける</text>
  <text x="574" y="658" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">館内で読</text>
  <text x="574" y="678" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">むだけ？</text>
  <text x="485" y="844" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">閲覧席へ案内する</text>
  <text x="663" y="834" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">予約だけ</text>
  <text x="663" y="854" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">したい？</text>
  <text x="569" y="986" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仮予約の票を渡す</text>
  <text x="569" y="1006" text-anchor="middle" font-size="14" fill="#6f6659">7 日間有効</text>
  <text x="758" y="996" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">後日の来館をお願いする</text>
