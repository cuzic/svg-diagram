  <text x="335" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">利用者カード</text>
  <text x="335" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">を持っている？</text>
  <text x="607" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">カードで受け付ける</text>
  <text x="335" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">本人確認の</text>
  <text x="335" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">書類がある？</text>
  <text x="607" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">その場でカードを作る</text>
  <text x="335" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">家族がカード</text>
  <text x="335" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">を持っている？</text>
  <text x="607" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">家族の同意書で受け付ける</text>
  <text x="335" y="538" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">館内で読</text>
  <text x="335" y="558" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">むだけ？</text>
  <text x="607" y="548" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">閲覧席へ案内する</text>
  <text x="335" y="674" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">予約だけ</text>
  <text x="335" y="694" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">したい？</text>
  <text x="607" y="674" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仮予約の票を渡す</text>
  <text x="607" y="694" text-anchor="middle" font-size="14" fill="#6f6659">7 日間有効</text>
  <text x="335" y="786" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">後日の来館をお願いする</text>
  <rect x="452" y="60" width="40" height="22" fill="#ffffff"/>
  <text x="472" y="76" text-anchor="middle" font-size="14" fill="#22201b">はい</text>
