  <text x="335" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">市内に住んでいるか、市内の学校や職場に通ってい</text>
  <text x="335" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">る？</text>
  <text x="683" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">カードで受け付ける</text>
  <text x="335" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">本人確認の書類がある？</text>
  <text x="683" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">その場でカードを作る</text>
  <text x="335" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">家族がカードを持っている？</text>
  <text x="683" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">家族の同意書で受け付ける</text>
  <text x="335" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">館内で読むだけ？</text>
  <text x="683" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">閲覧席へ案内する</text>
  <text x="335" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">予約だけしたい？</text>
  <text x="683" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">仮予約の票を渡す</text>
  <text x="683" y="354" text-anchor="middle" font-size="14" fill="#6f6659">7 日間有効</text>
  <text x="335" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">後日の来館をお願いする</text>
  <text x="335" y="442" text-anchor="middle" font-size="14" fill="#6f6659">必要な書類の一覧を渡す</text>
