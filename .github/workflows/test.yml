name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Japanese fonts (text widths are measured in a real browser)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: examples build and pass the rule check
        run: |
          for f in examples/*.ts; do node build-diagram.ts "$f" --out "/tmp/$(basename "$f" .ts).svg"; done
          node check-diagram.ts --strict examples/*.ts
