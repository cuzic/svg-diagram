name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      # the version is package.json's packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Japanese fonts (text widths are read from the font files; the browser comparisons need the same fonts)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      # the edge entries (spec/edge, pptx/edge) are tested with the font a Worker bundles, Noto Sans JP; it is kept out of fontconfig so the
      # browser comparisons above still see the same fonts (test/helpers/text-engine.ts reads SVG_DIAGRAM_JA_FONTS)
      - name: Noto Sans JP for the edge entries
        run: |
          d="$RUNNER_TEMP/ja-fonts"; mkdir -p "$d"
          base=https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/SubsetOTF/JP
          curl -sSfL -o "$d/NotoSansJP-Regular.otf" "$base/NotoSansJP-Regular.otf"
          curl -sSfL -o "$d/NotoSansJP-Bold.otf" "$base/NotoSansJP-Bold.otf"
          (cd "$d" && sha256sum -c - <<'SUMS'
          dff723ba59d57d136764a04b9b2d03205544f7cd785a711442d6d2d085ac5073  NotoSansJP-Regular.otf
          1b0edfb500b73a4fa8a4fcaae1bbbd403994e08e73e3e0da37e70d3853f42c5f  NotoSansJP-Bold.otf
          SUMS
          )
          echo "SVG_DIAGRAM_JA_FONTS=$d" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # the tests that compare with a real browser (lint --engine browser, --engine chromium, the Chromium measuring engine) need one
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
        if: matrix.shard == 1
      - run: pnpm lint
        if: matrix.shard == 1
      - run: pnpm bundle-size
        if: matrix.shard == 1
      # the test files are dealt out to three runners; every runner has the same fonts and browser, so a test that skips without one skips nowhere
      - run: node --test --test-shard=${{ matrix.shard }}/3 "test/*.test.ts"
      # building every example (and linting the SVGs strictly) is test/lint-cli.test.ts; one process per example here cost more than the rest of this job
      - name: examples pass the rule check
        if: matrix.shard == 1
        run: node check-diagram.ts --strict examples/*.ts
  # the goldens (examples/out/*.svg) are rebuilt and compared byte for byte (pnpm golden without writing anything).
  # Text widths come from the font files fontconfig picks. The text is measured with the pinned Noto Sans JP (the font the Worker bundles),
  # installed into fontconfig here (not in the test job, whose browser comparisons keep their fonts); the rest is the test job's fonts:
  # fonts-noto-cjk and what `playwright install --with-deps chromium` installs (install-deps: the same apt packages, without the browser).
  # scripts/golden-docker/Dockerfile has the same fonts for regenerating the goldens on any machine: change the two together.
  # The release and Node are pinned (not ubuntu-latest / 22) so that this job and the Docker image are the same environment.
  golden:
    name: golden (examples/out)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: pnpm
      - name: Japanese fonts (as in the test job)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - name: the browser's system packages and fonts (as in the test job)
        run: pnpm exec playwright install-deps chromium
      - name: Noto Sans JP (pinned) in fontconfig, so the text is measured with it (the script fails if it does not resolve)
        run: sudo scripts/golden-docker/install-noto-sans-jp.sh
      - name: which font files the widths are read from
        run: |
          for f in 'Hiragino Sans' 'Noto Sans JP' sans-serif 'Liberation Mono' monospace 'Noto Color Emoji'; do
            for w in 80 200; do echo "$f:weight=$w -> $(fc-match -f '%{file} (%{family})' "$f:weight=$w")"; done
          done
      # about 5 seconds on a runner, so the drift cache (ADR 0038) is not used: every source is rebuilt each time
      - name: the goldens match a rebuild
        id: golden
        run: pnpm golden --no-cache
      - name: how to regenerate
        if: failure() && steps.golden.outcome == 'failure'
        run: |
          msg="examples/out の golden が、CI のフォントでの再生成と一致しない。CI と同じフォントの Docker で作り直す: scripts/golden-docker.sh --write（変わった図を目で確かめてから examples/out をコミットする）。手元の pnpm golden はフォントが違うので正解にならない。README の「golden（examples/out）の検査と作り直し」を参照"
          echo "::error title=golden drift::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
