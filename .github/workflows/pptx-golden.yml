name: pptx-golden
# Run by hand (Actions → pptx-golden → Run workflow, or `gh workflow run pptx-golden.yml --ref <branch> -f update=true`).
# The PowerPoint golden (examples/out/pptx-golden.json) holds for the CI fonts, so it is compared and rewritten here, not on a laptop.
# With update, the rewritten manifest is uploaded as the artifact "pptx-golden"; commit it yourself after reading which names changed.
on:
  workflow_dispatch:
    inputs:
      update:
        description: rewrite the manifest and upload it
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the same setup as test.yml, so the hashes match what the tests see
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: compare
        id: compare
        continue-on-error: ${{ inputs.update }}
        run: pnpm golden:pptx
      - name: update
        if: inputs.update
        run: |
          node test/helpers/pptx/golden.ts --update examples/*.ts
          git diff --stat examples/out/pptx-golden.json
      - if: inputs.update
        uses: actions/upload-artifact@v4
        with:
          name: pptx-golden
          path: examples/out/pptx-golden.json
