name: pptx-golden
# Run by hand (Actions → pptx-golden → Run workflow, or `gh workflow run pptx-golden.yml --ref <branch> -f update=true`).
# The PowerPoint golden (examples/out/pptx-golden.json) holds for the golden jobs' fonts (pinned Noto Sans JP), so it is compared and rewritten here, not on a laptop.
# With update, the rewritten manifest is uploaded as the artifact "pptx-golden"; commit it yourself after reading which names changed.
on:
  workflow_dispatch:
    inputs:
      update:
        description: rewrite the manifest and upload it
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  golden:
    # the same environment as test.yml's golden job and scripts/golden-docker/Dockerfile (release, Node, fonts), so the hashes match there
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: pnpm
      - name: Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # the text is measured with the pinned Noto Sans JP, as in test.yml's golden job (scripts/golden-docker/Dockerfile has the same fonts)
      - name: Noto Sans JP (pinned) in fontconfig
        run: sudo scripts/golden-docker/install-noto-sans-jp.sh
      - name: compare
        id: compare
        continue-on-error: ${{ inputs.update }}
        run: pnpm golden:pptx
      - name: update
        if: inputs.update
        run: |
          node test/helpers/pptx/golden.ts --update examples/*.ts
          git diff --unified=0 examples/out/pptx-golden.json
      - if: inputs.update
        uses: actions/upload-artifact@v4
        with:
          name: pptx-golden
          path: examples/out/pptx-golden.json
